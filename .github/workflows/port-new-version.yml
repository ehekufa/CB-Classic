name: port-new-version (ручной)
# Ручной запуск: качает архив новой версии из релиза GitHub, переносит проект
# в порт (original/ -> assets/ + generated/lua), проверяет сборку и коммитит
# результат в текущую ветку. Дальше push сам запускает сборку APK (android-apk).
on:
  # ручной запуск из вкладки Actions (работает, когда файл есть в main)
  workflow_dispatch:
    inputs:
      tag:
        description: тег релиза с архивом проекта
        default: "No"
        required: true
      asset:
        description: имя файла в релизе (пусто — первый zip)
        default: "super.kortohka.zip"
        required: false
  # а это — запуск из рабочей ветки: достаточно запушить файл-заявку .port-request
  push:
    paths:
      - ".port-request"
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_IN: ${{ inputs.tag }}
          ASSET_IN: ${{ inputs.asset }}
        run: |
          TAG="${TAG_IN:-No}"
          ASSET="${ASSET_IN:-super.kortohka.zip}"
          echo "релиз: $TAG, файл: $ASSET"
          mkdir -p /tmp/dl
          if [ -n "$ASSET" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D /tmp/dl
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "*.zip" -D /tmp/dl
          fi
          ls -la /tmp/dl
          du -sh /tmp/dl

      - name: Install ffmpeg (для кадров видео-интро)
        # tools/extract_videos.py режет MP4 на PNG: сгодится либо системный
        # ffmpeg, либо бинарник из пакета imageio-ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || \
              pip install imageio-ffmpeg
          fi
          ffmpeg -version 2>/dev/null | head -1 || python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Port project (original -> assets + generated)
        run: |
          Z=$(ls /tmp/dl/*.zip | head -1)
          tools/port_new_version.sh "$Z" --no-build
          du -sh original assets generated
          find original -type f | wc -l
          find generated/lua -name '*.lua' | wc -l
          cat ops/excluded-large-files.txt || true

      - name: Build and self-tests (informational)
        continue-on-error: true
        run: |
          make -s -j4
          ./tests/run_tests.sh 2>&1 | tail -60

      - name: Commit imported project
        run: |
          set -e
          git config user.name "port-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -q --ignore-unmatch .port-request || true
          git add -A .
          git commit -m "feat: новая версия проекта из релиза" || echo "нет изменений"
          # сборка APK тоже коммитит в эту ветку (отчёт), поэтому push повторяем
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "запушено с попытки $attempt"
              exit 0
            fi
            echo "::warning title=git push::попытка $attempt не удалась, повтор"
            sleep 15
          done
          echo "::error title=git push::не удалось запушить перенос"
          exit 1
