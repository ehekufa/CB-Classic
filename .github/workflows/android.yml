name: android-apk

# Собирает APK нативной версии (C/C++ + Lua + SDL2) и публикует его в релизе.
# В песочнице Android SDK/NDK нет, поэтому сборка идёт на раннере GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [arena/f69adc32-cb-classic]
    paths:
      - 'android/**'
      - 'src/**'
      - 'assets/**'
      - 'generated/**'
      - 'third_party/lua-5.4/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

env:
  SDL_VERSION: release-2.30.9
  NDK_VERSION: 26.1.10909125
  GRADLE_VERSION: 8.7

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK и NDK
        run: |
          set -x
          if [ ! -d "${ANDROID_HOME:-/nonexistent}" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "cmake;3.22.1" \
                                  "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          ls "$ANDROID_HOME/ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Исходники SDL2
        run: |
          curl -sSL -o /tmp/sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/archive/refs/tags/${SDL_VERSION}.tar.gz"
          mkdir -p third_party/SDL
          tar xzf /tmp/sdl.tar.gz -C third_party/SDL --strip-components=1
          test -f third_party/SDL/CMakeLists.txt
          echo "SDL2 $(cat third_party/SDL/include/SDL_version.h | grep -m1 MAJOR)"

      - name: Java-классы SDL и упаковка ресурсов
        run: |
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp third_party/SDL/android-project/app/src/main/java/org/libsdl/app/*.java \
             android/app/src/main/java/org/libsdl/app/

          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/src android/app/src/main/assets/generated
          cp -r assets            android/app/src/main/assets/assets
          cp -r src/lua           android/app/src/main/assets/src/lua
          cp -r generated/lua     android/app/src/main/assets/generated/lua
          du -sh android/app/src/main/assets

      - name: Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Сборка APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          set +e
          (cd android && gradle assembleDebug --no-daemon --stacktrace) > android-build.log 2>&1
          STATUS=$?
          echo "код возврата gradle: $STATUS" >> android-build.log
          if [ $STATUS -ne 0 ]; then
            echo "СБОРКА НЕ УДАЛАСЬ" >> android-build.log
          fi
          tail -n 40 android-build.log
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Отчёт и APK в релиз
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch android-build.log
          mkdir -p dist
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            cp "$APK" dist/cb-classic-debug.apk
          fi

          {
            echo "# Отчёт сборки APK"
            echo
            echo "- дата: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- SDL: ${SDL_VERSION}"
            echo "- NDK: ${NDK_VERSION}"
            echo "- Gradle: ${GRADLE_VERSION}"
            echo
            if [ -f dist/cb-classic-debug.apk ]; then
              echo "## APK"
              echo
              echo '```'
              ls -la dist/cb-classic-debug.apk
              sha256sum dist/cb-classic-debug.apk
              unzip -l dist/cb-classic-debug.apk | egrep 'classes.dex|lib/|assets/project.lua|assets/scenes/26|AndroidManifest' | head -20
              echo '...'
              unzip -l dist/cb-classic-debug.apk | tail -3
              echo '```'
              echo
              echo "всего записей: $(unzip -l dist/cb-classic-debug.apk | tail -1 | awk '{print $2}')"
            else
              echo "## APK не собрался"
            fi
            echo
            echo "## Хвост лога сборки"
            echo
            echo '```'
            tail -n 120 android-build.log || true
            echo '```'
          } > ops/apk-report.md

          # публикуем APK в релизе, чтобы его можно было скачать с GitHub
          if [ -f dist/cb-classic-debug.apk ]; then
            gh release view apk-latest >/dev/null 2>&1 || \
              gh release create apk-latest --title "APK: Cubic battle (C/C++/Lua)" \
                --notes "Отладочная сборка нативной версии. Установка: разрешить установку из неизвестных источников и открыть файл." \
                dist/cb-classic-debug.apk
            gh release upload apk-latest dist/cb-classic-debug.apk --clobber || true
            gh release edit apk-latest --notes "Отладочная сборка нативной версии ($(date -u +%Y-%m-%d)). Установка: разрешить установку из неизвестных источников и открыть файл." || true
          fi

          git config user.name "apk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f ops/apk-report.md
          git add -f android-build.log || true
          git commit -m "build(android): отчёт сборки APK" || echo "нечего коммитить"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" && echo "отчёт закоммичен" || \
            echo "::warning title=git push::не удалось запушить отчёт"
          # короткая выжимка в аннотацию проверки — единственный видимый снаружи канал логов
          SUMMARY="$(tail -n 25 android-build.log | tr '\n' '|' | cut -c1-3000)"
          echo "::warning title=хвост лога сборки::${SUMMARY}"
          APKINFO="$( [ -f dist/cb-classic-debug.apk ] && ls -l dist/cb-classic-debug.apk && sha256sum dist/cb-classic-debug.apk || echo 'APK нет' )"
          echo "::warning title=APK::${APKINFO}"
