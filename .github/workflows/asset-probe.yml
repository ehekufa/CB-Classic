name: asset-probe
on:
  push:
    branches: [arena/f69adc32-cb-classic]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/dl
          gh release download "YOU_DON'T_NEED_IT" --repo "$GITHUB_REPOSITORY" -D /tmp/dl
          ls -la /tmp/dl
          sha256sum /tmp/dl/*.zip
      - name: Build manifest
        run: |
          Z=$(ls /tmp/dl/*.zip | head -1)
          mkdir -p ops
          {
            echo "# archive manifest"
            echo
            echo "- asset: $(basename "$Z")"
            echo "- bytes: $(stat -c%s "$Z")"
            echo "- sha256: $(sha256sum "$Z" | cut -d' ' -f1)"
            echo
            echo "## entries: $(unzip -Z1 "$Z" | wc -l)"
            echo
            echo "## extensions"
            echo '```'
            unzip -Z1 "$Z" | awk -F. 'NF>1{print tolower($NF)}' | sort | uniq -c | sort -rn | head -50
            echo '```'
            echo
            echo "## top-level"
            echo '```'
            unzip -Z1 "$Z" | awk -F/ '{print $1}' | sort -u | head -80
            echo '```'
            echo
            echo "## dirs depth<=2"
            echo '```'
            unzip -Z1 "$Z" | awk -F/ 'NF>1{print $1"/"$2}' | sort -u | head -120
            echo '```'
            echo
            echo "## 40 largest"
            echo '```'
            unzip -l "$Z" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {print $1"\t"$4}' | sort -rn | head -40
            echo '```'
            echo
            echo "## first 400 paths"
            echo '```'
            unzip -Z1 "$Z" | head -400
            echo '```'
          } > ops/manifest.md
          wc -l ops/manifest.md
      - name: Commit manifest
        run: |
          git config user.name "asset-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ops/manifest.md
          git commit -m "ops: archive manifest" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
