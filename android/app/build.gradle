plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cbclassic'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'org.cbclassic'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '2.8'

        ndk {
            // arm64 — современные телефоны, armeabi-v7a — старые устройства
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // сюда CI складывает assets/, generated/lua/ и src/lua/
            assets.srcDirs = ['src/main/assets']
            java.srcDirs = ['src/main/java']
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/*.version']
        }
    }

    lint {
        abortOnError false
    }
}
